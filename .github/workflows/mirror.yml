name: Mirror Claude Desktop Installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional new release tag, or existing release to restore when resync_r2 is enabled.
        required: false
        type: string
      force_release:
        description: Publish even when the latest release already matches current sources.
        required: false
        default: false
        type: boolean
      resync_r2:
        description: Restore R2 from an existing GitHub Release without publishing a new release.
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "11 */6 * * *"

permissions:
  contents: read

env:
  R2_BUCKET_NAME: claude-app-mirror
  R2_PUBLIC_BASE_URL: https://mirror.cognia.cn

concurrency:
  group: claude-app-mirror
  cancel-in-progress: false

jobs:
  probe:
    name: Probe current version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.probe.outputs.should_release }}
      release_tag: ${{ steps.probe.outputs.release_tag }}
      latest_tag: ${{ steps.probe.outputs.latest_tag }}
      skip_reason: ${{ steps.probe.outputs.skip_reason }}
      version_summary: ${{ steps.probe.outputs.version_summary }}
      manifest: ${{ steps.probe.outputs.manifest }}
      should_sync: ${{ steps.recovery.outputs.should_sync }}
      sync_tag: ${{ steps.recovery.outputs.sync_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Probe update API
        id: probe
        if: inputs.resync_r2 != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE_RELEASE: ${{ inputs.force_release || 'false' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/probe-release.sh

      - name: Check R2 recovery
        id: recovery
        if: inputs.resync_r2 == true || steps.probe.outputs.should_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESYNC_R2: ${{ inputs.resync_r2 || 'false' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash scripts/check-r2-recovery.sh

  release:
    name: Mirror and publish release
    runs-on: ubuntu-latest
    needs: probe
    if: needs.probe.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Checkout agents-mirror-kit
        uses: actions/checkout@v6
        with:
          repository: Wangnov/agents-mirror-kit
          ref: v0.1.0
          path: .mirror-kit

      - name: Restore probe manifest
        shell: bash
        env:
          PROBE_MANIFEST: ${{ needs.probe.outputs.manifest }}
        run: printf '%s\n' "$PROBE_MANIFEST" > probe-manifest.json

      - name: Download installers
        shell: bash
        run: bash scripts/download-artifacts.sh dist probe-manifest.json

      - name: Prepare release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ needs.probe.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-release-metadata.sh \
            probe-manifest.json \
            dist \
            "$R2_PUBLIC_BASE_URL" \
            "$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_TITLE: ${{ steps.meta.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md \
            dist/Claude-mac-universal.dmg \
            dist/Claude-win-x64.msix \
            dist/Claude-win-arm64.msix \
            SHA256SUMS.txt \
            release-manifest.json

      - name: Remove latest links from previous release notes
        if: needs.probe.outputs.latest_tag != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREVIOUS_TAG: ${{ needs.probe.outputs.latest_tag }}
        shell: bash
        run: bash .mirror-kit/scripts/remove-latest-links-from-release-notes.sh "$PREVIOUS_TAG"

      - name: Ensure AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Sync release assets to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_S3_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: bash scripts/sync-release-to-r2.sh

  recover_r2:
    name: Restore existing release to R2
    runs-on: ubuntu-latest
    needs: probe
    if: needs.probe.outputs.should_sync == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Checkout agents-mirror-kit
        uses: actions/checkout@v6
        with:
          repository: Wangnov/agents-mirror-kit
          ref: v0.1.0
          path: .mirror-kit

      - name: Ensure AWS CLI
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user awscli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Restore and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.probe.outputs.sync_tag }}
        run: bash scripts/restore-release-assets.sh

      - name: Sync existing release to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_S3_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: bash scripts/sync-release-to-r2.sh

  no_changes:
    name: No new version
    runs-on: ubuntu-latest
    needs: probe
    if: needs.probe.outputs.should_release != 'true' && needs.probe.outputs.should_sync != 'true'
    steps:
      - name: Report current state
        env:
          SKIP_REASON: ${{ needs.probe.outputs.skip_reason }}
          VERSION_SUMMARY: ${{ needs.probe.outputs.version_summary }}
        run: |
          echo "No new Claude desktop version detected."
          echo "$SKIP_REASON"
          echo "$VERSION_SUMMARY"
